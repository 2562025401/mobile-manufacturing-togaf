<script>
async function getCanvas() {
  return await html2canvas(document.getElementById('diagram'), {
    backgroundColor: '#ffffff',
    scale: 2,
    useCORS: true,
    logging: false,
    width: document.getElementById('diagram').scrollWidth,
    height: document.getElementById('diagram').scrollHeight,
    windowWidth: document.getElementById('diagram').scrollWidth,
    windowHeight: document.getElementById('diagram').scrollHeight,
  });
}

async function exportPNG() {
  try {
    const canvas = await getCanvas();
    const link = document.createElement('a');
    link.download = '图2-6_IPD流程泳道图.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) {
    alert('导出PNG失败: ' + e.message);
  }
}

async function exportPDF() {
  try {
    const canvas = await getCanvas();
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({orientation:'l', unit:'mm', format:'a4'});
    const pdfW = pdf.internal.pageSize.getWidth();
    const pdfH = (canvas.height * pdfW) / canvas.width;
    pdf.addImage(imgData, 'PNG', 0, 0, pdfW, pdfH);
    pdf.save('图2-6_IPD流程泳道图.pdf');
  } catch(e) {
    alert('导出PDF失败: ' + e.message);
  }
}

async function copyDiagram() {
  try {
    const canvas = await getCanvas();
    canvas.toBlob(async function(blob) {
      try {
        await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
      } catch(e) {
        const url = URL.createObjectURL(blob);
        const img = document.createElement('img');
        img.src = url;
        const sel = window.getSelection();
        const range = document.createRange();
        document.body.appendChild(img);
        range.selectNodeContents(img);
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand('copy');
        document.body.removeChild(img);
        URL.revokeObjectURL(url);
      }
    });
  } catch(e) {
    alert('复制失败: ' + e.message);
  }
}
</script>
