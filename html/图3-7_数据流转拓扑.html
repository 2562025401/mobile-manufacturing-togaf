<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script>
function showStatus(msg) {
  document.getElementById('status').textContent = msg;
  setTimeout(function(){ document.getElementById('status').textContent = ''; }, 3000);
}
async function copyAsImage() {
  try {
    var el = document.getElementById('diagram');
    var canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    var blob = await new Promise(function(resolve){ canvas.toBlob(resolve, 'image/png'); });
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    showStatus('已复制到剪贴板');
  } catch(e) { showStatus('复制失败: ' + e.message); }
}
async function downloadPNG() {
  try {
    var el = document.getElementById('diagram');
    var canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    var link = document.createElement('a');
    link.download = '图3-7_数据流转拓扑.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showStatus('PNG已下载');
  } catch(e) { showStatus('下载失败: ' + e.message); }
}
async function downloadPDF() {
  try {
    var el = document.getElementById('diagram');
    var canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    var imgData = canvas.toDataURL('image/png');
    var pdf = new jspdf.jsPDF({ orientation: 'landscape', unit: 'px', format: [canvas.width/2, canvas.height/2] });
    pdf.addImage(imgData, 'PNG', 0, 0, canvas.width/2, canvas.height/2);
    pdf.save('图3-7_数据流转拓扑.pdf');
    showStatus('PDF已下载');
  } catch(e) { showStatus('下载失败: ' + e.message); }
}
</script>
