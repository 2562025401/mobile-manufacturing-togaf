<script>
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2200)
}

async function capture(){
  return html2canvas(document.getElementById('diagram'),{
    backgroundColor:'#f8fafc',
    scale:2,
    logging:false,
    useCORS:true
  })
}

async function copyDiagram(){
  try{
    var c=await capture();
    var b=await new Promise(function(r){c.toBlob(r,'image/png')});
    await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);
    showToast('Copied to clipboard!')
  }catch(e){
    showToast('Copy failed: '+e.message)
  }
}

async function downloadPNG(){
  try{
    var c=await capture();
    var a=document.createElement('a');
    a.download='图3-9_数据驱动双义.png';
    a.href=c.toDataURL('image/png');
    a.click();
    showToast('PNG downloaded!')
  }catch(e){
    showToast('PNG failed: '+e.message)
  }
}

async function downloadPDF(){
  try{
    var c=await capture();
    var img=c.toDataURL('image/png');
    var w=c.width;
    var h=c.height;
    var pdf=new jspdf.jsPDF({orientation:w>h?'landscape':'portrait',unit:'px',format:[w,h]});
    pdf.addImage(img,'PNG',0,0,w,h);
    pdf.save('图3-9_数据驱动双义.pdf');
    showToast('PDF downloaded!')
  }catch(e){
    showToast('PDF failed: '+e.message)
  }
}
</script>
