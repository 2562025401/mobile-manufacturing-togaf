<style>

<script>
function getSVGBlob() {
  const svg = document.getElementById('main-svg');
  const clone = svg.cloneNode(true);
  const serializer = new XMLSerializer();
  return new Blob([serializer.serializeToString(clone)], {type: 'image/svg+xml;charset=utf-8'});
}

function copySVG() {
  const svg = document.getElementById('main-svg');
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(svg);
  navigator.clipboard.writeText(svgStr).then(() => {
    showToast('SVG copied to clipboard');
  }).catch(() => {
    showToast('Copy failed');
  });
}

function exportPNG() {
  const el = document.getElementById('diagram-container');
  html2canvas(el, {
    scale: 2.5,
    backgroundColor: '#ffffff',
    logging: false,
    windowWidth: el.scrollWidth,
    windowHeight: el.scrollHeight
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = '图2-2_商业模式画布.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('PNG exported');
  }).catch(() => {
    showToast('PNG export failed');
  });
}

function exportPDF() {
  const el = document.getElementById('diagram-container');
  html2canvas(el, {
    scale: 2.5,
    backgroundColor: '#ffffff',
    logging: false,
    windowWidth: el.scrollWidth,
    windowHeight: el.scrollHeight
  }).then(canvas => {
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({orientation: 'landscape', unit: 'px', format: [el.offsetWidth, el.offsetHeight]});
    pdf.addImage(imgData, 'PNG', 0, 0, el.offsetWidth, el.offsetHeight);
    pdf.save('图2-2_商业模式画布.pdf');
    showToast('PDF exported');
  }).catch(() => {
    showToast('PDF export failed');
  });
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  Object.assign(t.style, {
    position:'fixed', bottom:'30px', left:'50%', transform:'translateX(-50%)',
    background:'#1e293b', color:'#ffffff', padding:'8px 20px', borderRadius:'8px',
    fontFamily:'JetBrains Mono, monospace', fontSize:'12px', zIndex:'9999',
    boxShadow:'0 4px 12px rgba(0,0,0,0.15)', transition:'opacity 0.3s'
  });
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 1500);
}
</script>
