<script>
function copySVG() {
  const svg = document.getElementById('diagram');
  const clone = svg.cloneNode(true);
  clone.removeAttribute('style');
  const serializer = new XMLSerializer();
  const str = serializer.serializeToString(clone);
  navigator.clipboard.writeText(str).then(() => {
    const btn = document.querySelector('.toolbar button:first-child');
    const orig = btn.textContent;
    btn.textContent = '✓ Copied!';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}
function exportPNG() {
  document.getElementById('loading').style.display = 'block';
  const el = document.getElementById('container');
  html2canvas(el, { scale: 2, backgroundColor: '#f8fafc', useCORS: true, logging: false }).then(canvas => {
    document.getElementById('loading').style.display = 'none';
    const link = document.createElement('a');
    link.download = '图4-4_应用分层架构.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(e => { document.getElementById('loading').style.display = 'none'; alert('Export error: ' + e.message); });
}
function exportPDF() {
  document.getElementById('loading').style.display = 'block';
  const el = document.getElementById('container');
  html2canvas(el, { scale: 2, backgroundColor: '#f8fafc', useCORS: true, logging: false }).then(canvas => {
    document.getElementById('loading').style.display = 'none';
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [canvas.width * 0.75, canvas.height * 0.75] });
    pdf.addImage(imgData, 'PNG', 0, 0, canvas.width * 0.75, canvas.height * 0.75);
    pdf.save('图4-4_应用分层架构.pdf');
  }).catch(e => { document.getElementById('loading').style.display = 'none'; alert('Export error: ' + e.message); });
}
</script>
