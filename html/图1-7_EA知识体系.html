<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js" crossorigin="anonymous"></script>
<script>
const captureEl = document.getElementById('capture');

async function copySVG() {
  try {
    const canvas = await html2canvas(captureEl, { scale: 2, backgroundColor: '#f8fafc', useCORS: true });
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    showToast('Copied to clipboard');
  } catch(e) {
    showToast('Copy failed: ' + e.message);
  }
}

async function downloadPNG() {
  try {
    const canvas = await html2canvas(captureEl, { scale: 2, backgroundColor: '#f8fafc', useCORS: true });
    const link = document.createElement('a');
    link.download = '图1-7_EA知识体系.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('PNG downloaded');
  } catch(e) {
    showToast('PNG failed: ' + e.message);
  }
}

async function downloadPDF() {
  try {
    const canvas = await html2canvas(captureEl, { scale: 2, backgroundColor: '#f8fafc', useCORS: true });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [canvas.width, canvas.height] });
    pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
    pdf.save('图1-7_EA知识体系.pdf');
    showToast('PDF downloaded');
  } catch(e) {
    showToast('PDF failed: ' + e.message);
  }
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if(!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 24px;border-radius:8px;font-family:JetBrains Mono,monospace;font-size:13px;z-index:9999;opacity:0;transition:opacity 0.3s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; }, 2000);
}
</script>
