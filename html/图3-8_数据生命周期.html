<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>图3-8 数据生命周期管理</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

.toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-self: flex-end; }

</head>
<body>

<div class="toolbar">

<rect width="1200" height="720" fill="#ffffff"/>
<rect width="1200" height="720" fill="url(#grid)"/>

<line x1="40" y1="65" x2="1160" y2="65" stroke="#e2e8f0" stroke-width="1"/>

<!-- ===================== TOP FLOW: 生命周期五阶段 ===================== -->
<rect x="30" y="75" width="1140" height="26" rx="4" fill="rgba(99,102,241,0.06)"/>
<text x="600" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">数据生命周期五阶段</text>

<!-- Stage 1: 数据产生 -->
<g>

  <rect x="95" y="115" width="170" height="4" rx="2" fill="#3b82f6"/>

<line x1="265" y1="152" x2="298" y2="152" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="387" y="182" text-anchor="middle" font-size="10" fill="#475569">安全加密</text>
</g>

<line x1="472" y1="152" x2="505" y2="152" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

<polygon points="120,510 115,500 125,500" fill="#94a3b8"/>

<polygon points="525,510 520,500 530,500" fill="#94a3b8"/>

  <rect x="640" y="482" width="510" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>

  <text x="1040" y="634" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">⏱ 30天强制窗口</text>

<text x="80" y="676" font-size="10" fill="#475569">合规要求：</text>
<text x="150" y="676" font-size="10" fill="#1e293b">用户行使被遗忘权提出注销请求后，须在30天内完成全系统PII数据定位与擦除，覆盖CRM/ERP/MDM/数据湖/日志等全部数据存储系统，并出具合规证明报告。</text>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script>
function showStatus(msg) {
  document.getElementById('status').textContent = msg;
  setTimeout(function(){ document.getElementById('status').textContent = ''; }, 3000);
}
async function copyAsImage() {
  try {
    var el = document.getElementById('diagram');
    var canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    var blob = await new Promise(function(resolve){ canvas.toBlob(resolve, 'image/png'); });
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    showStatus('已复制到剪贴板');
  } catch(e) { showStatus('复制失败: ' + e.message); }
}
async function downloadPNG() {
  try {
    var el = document.getElementById('diagram');
    var canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    var link = document.createElement('a');
    link.download = '图3-8_数据生命周期.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showStatus('PNG已下载');
  } catch(e) { showStatus('下载失败: ' + e.message); }
}
async function downloadPDF() {
  try {
    var el = document.getElementById('diagram');
    var canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    var imgData = canvas.toDataURL('image/png');
    var pdf = new jspdf.jsPDF({ orientation: 'landscape', unit: 'px', format: [canvas.width/2, canvas.height/2] });
    pdf.addImage(imgData, 'PNG', 0, 0, canvas.width/2, canvas.height/2);
    pdf.save('图3-8_数据生命周期.pdf');
    showStatus('PDF已下载');
  } catch(e) { showStatus('下载失败: ' + e.message); }
}
</script>

</html>
