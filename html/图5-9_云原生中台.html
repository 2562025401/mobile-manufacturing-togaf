<script>

function exportPNG(){var card=getCardElement();html2canvas(card,{scale:2,backgroundColor:'#ffffff',useCORS:!0,logging:!1}).then(function(canvas){var a=document.createElement('a');a.download='图5-9_云原生中台.png';a.href=canvas.toDataURL('image/png');a.click();});}
