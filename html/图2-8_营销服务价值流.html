<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js" integrity="sha384-ZSs6LKr2GoUPDyHrN+rCQgyHL1yUyok5xMniSrgeRG7rUvA6vTmxronM1eZOfjgz" crossorigin="anonymous"></script>
<script>
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2000);
}
async function copyDiagram() {
  try {
    var el = document.getElementById('diagram');
    var canvas = await html2canvas(el, { backgroundColor: '#ffffff', scale: 2, useCORS: true, logging: false });
    var blob = await new Promise(function(resolve){ canvas.toBlob(resolve, 'image/png'); });
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    showToast('Copied to clipboard!');
  } catch(e) { showToast('Copy failed: ' + e.message); }
}
async function exportPNG() {
  try {
    var el = document.getElementById('diagram');
    var canvas = await html2canvas(el, { backgroundColor: '#ffffff', scale: 2, useCORS: true, logging: false });
    var link = document.createElement('a');
    link.download = '图2-8_营销服务价值流.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('PNG exported!');
  } catch(e) { showToast('PNG export failed: ' + e.message); }
}
async function exportPDF() {
  try {
    var el = document.getElementById('diagram');
    var canvas = await html2canvas(el, { backgroundColor: '#ffffff', scale: 2, useCORS: true, logging: false });
    var imgData = canvas.toDataURL('image/png');
    var pdf = new jspdf.jsPDF({ orientation: 'l', unit: 'mm', format: 'a4' });
    var pw = pdf.internal.pageSize.getWidth();
    var ph = (canvas.height * pw) / canvas.width;
    pdf.addImage(imgData, 'PNG', 0, 0, pw, ph);
    pdf.save('图2-8_营销服务价值流.pdf');
    showToast('PDF exported!');
  } catch(e) { showToast('PDF export failed: ' + e.message); }
}
</script>
