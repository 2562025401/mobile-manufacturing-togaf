<script>
function getCaptureElement(){return document.getElementById('capture')}
function copyAsImage(){
  html2canvas(getCaptureElement(),{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(canvas=>{
    canvas.toBlob(blob=>{navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(()=>{
      const btn=event&&event.target?event.target:document.querySelector('.toolbar button:first-child');
      if(btn){const o=btn.textContent;btn.textContent='Copied!';btn.style.background='#d1fae5';btn.style.borderColor='#34d399';setTimeout(()=>{btn.textContent=o;btn.style.background='';btn.style.borderColor=''},2000)}
    }).catch(()=>alert('Copy failed.'))})
  })
}
function downloadPNG(){
  html2canvas(getCaptureElement(),{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(canvas=>{
    const link=document.createElement('a');link.download='图4-8_应用成熟度.png';link.href=canvas.toDataURL('image/png');link.click()
  })
}
function downloadPDF(){
  html2canvas(getCaptureElement(),{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(canvas=>{
    const imgData=canvas.toDataURL('image/png');
    const{jsPDF}=window.jspdf;
    const pdf=new jsPDF('l','mm','a3');
    const pdfW=pdf.internal.pageSize.getWidth();
    const pdfH=canvas.height*pdfW/canvas.width;
    pdf.addImage(imgData,'PNG',0,0,pdfW,pdfH);
    pdf.save('图4-8_应用成熟度.pdf')
  })
}
</script>
