<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" integrity="sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/" crossorigin="anonymous"></script>
<script>
const container = document.getElementById('diagram-container');
const status = document.getElementById('status');
let msgTimeout;

function showMsg(msg, isErr) {
  clearTimeout(msgTimeout);
  status.textContent = msg;
  status.style.color = isErr ? '#ef4444' : '#64748b';
  if (!isErr) msgTimeout = setTimeout(() => { status.textContent = ''; }, 3000);
}

function copySVG() {
  const svgEl = container.querySelector('svg');
  const cloned = svgEl.cloneNode(true);
  cloned.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(cloned);
  navigator.clipboard.writeText(svgStr).then(() => {
    showMsg('SVG copied to clipboard');
  }).catch(() => {
    showMsg('Copy failed', true);
  });
}

function exportPNG() {
  showMsg('Generating PNG...');
  html2canvas(container, {
    backgroundColor: '#ffffff',
    scale: 2,
    useCORS: true,
    logging: false
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = '图4-12_低代码平台.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showMsg('PNG exported');
  }).catch(e => {
    showMsg('PNG export failed', true);
    console.error(e);
  });
}

function exportPDF() {
  showMsg('Generating PDF...');
  html2canvas(container, {
    backgroundColor: '#ffffff',
    scale: 2,
    useCORS: true,
    logging: false
  }).then(canvas => {
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('l', 'mm', 'a4');
    const pdfW = pdf.internal.pageSize.getWidth();
    const pdfH = (canvas.height * pdfW) / canvas.width;
    pdf.addImage(imgData, 'PNG', 0, 0, pdfW, pdfH);
    pdf.save('图4-12_低代码平台.pdf');
    showMsg('PDF exported');
  }).catch(e => {
    showMsg('PDF export failed', true);
    console.error(e);
  });
}
</script>
